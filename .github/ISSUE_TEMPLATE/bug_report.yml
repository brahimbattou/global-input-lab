name: Bug Report
description: Create a report to help us reproduce and fix an issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with GlobalInputLab. Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Description of the Problem
      description: A clear and concise description of what the bug is.
      placeholder: Slicing a string with specific Bengali characters results in an invalid surrogate...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Code or Test Vector
      description: Please share minimal code, CLI command, or input string to reproduce the issue.
      render: typescript
      placeholder: |
        import { inspectByteTruncation } from 'global-input-lab';
        const result = inspectByteTruncation('...', 10);
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what actually occurred?
      placeholder: Expected result to be preserved without U+FFFD, but got corruption.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Operating System / Environment
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      placeholder: e.g. v20.11.0
    validations:
      required: true
