name: Feature Request
description: Suggest an idea or enhancement for GlobalInputLab
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate feature suggestions and new ideas for improving international input testing.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or missing capability?
      placeholder: I am always running into issues when testing PostgreSQL UTF-8 column boundaries in CI...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or new feature you would like to see.
      placeholder: Provide a CLI flag or adapter that...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've explored.
