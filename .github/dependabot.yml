version: 2
updates:
  # Monitor and update npm development dependencies in package.json / package-lock.json
  # Note: All Dependabot PRs require full CI matrix verification and manual maintainer review before merging.
  # Auto-merge is intentionally disabled.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      npm-dev-minor-and-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Monitor and update GitHub Actions versions in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
